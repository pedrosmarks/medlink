<div class="login-container">
  <form (ngSubmit)="login()">
    <div class="mb-3">
      <label>Usuário</label>
      <input class="form-control" [(ngModel)]="usuario" name="usuario" required>
    </div>
    <div class="mb-3">
      <label>Senha</label>
      <input type="password" class="form-control" [(ngModel)]="senha" name="senha" required>
    </div>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <div *ngIf="erro" class="alert alert-danger mt-2">{{ erro }}</div>
  </form>
</div>
