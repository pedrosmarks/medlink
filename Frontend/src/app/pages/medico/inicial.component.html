
<div class="sidebar-container">
  <aside class="modern-sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <h3>MedLink</h3>
        <span class="subtitle">Área do Médico</span>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a [routerLink]="['/medico/dashboard']" routerLinkActive="active" class="nav-link">
            <div class="nav-icon">
              <fa-icon [icon]="faDesktop"></fa-icon>
            </div>
            <span class="nav-text">Dashboard</span>
            <div class="nav-indicator"></div>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/medico/perfil']" routerLinkActive="active" class="nav-link">
            <div class="nav-icon">
              <fa-icon [icon]="faCircleUser"></fa-icon>
            </div>
            <span class="nav-text">Perfil</span>
            <div class="nav-indicator"></div>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/medico/pacientes']" routerLinkActive="active" class="nav-link">
            <div class="nav-icon">
              <fa-icon [icon]="faHospitalUser"></fa-icon>
            </div>
            <span class="nav-text">Pacientes</span>
            <div class="nav-indicator"></div>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/medico/mensagem']" routerLinkActive="active" class="nav-link">
            <div class="nav-icon">
              <fa-icon [icon]="faMessage"></fa-icon>
            </div>
            <span class="nav-text">Mensagens</span>
            <div class="nav-indicator"></div>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/medico/notificacoes']" routerLinkActive="active" class="nav-link">
            <div class="nav-icon">
              <fa-icon [icon]="faBell"></fa-icon>
            </div>
            <span class="nav-text">Notificações</span>
            <div class="nav-indicator"></div>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="user-section">
      <div class="user-info">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
             alt="Médico" class="user-avatar">
        <div class="user-details">
          <h3 class="user-name">{{ medicoNome }}</h3>
          <p class="user-email">{{ medicoEmail }}</p>
        </div>
      </div>
      
      <button class="logout-button" (click)="logout()" title="Sair do sistema">
        <fa-icon [icon]="faSignOutAlt" class="logout-icon"></fa-icon>
        <span class="logout-text">Sair</span>
      </button>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
