<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>
<h2>Medicamentos de {{ pacienteNome }}</h2>

<div class="mb-3">
  <div class="row mb-2">
    <div class="col-md-4">
      <input type="text" class="form-control" [(ngModel)]="novoMedicamentoName" placeholder="Nome do medicamento">
    </div>
    <div class="col-md-4">
      <input type="text" class="form-control" [(ngModel)]="novoMedicamentoDosage" placeholder="Dosagem">
    </div>
    <div class="col-md-4">
      <input type="text" class="form-control" [(ngModel)]="novoMedicamentoFrequency" placeholder="Frequência">
    </div>
  </div>
  <button class="btn btn-success" (click)="adicionarMedicamento()">Adicionar Medicamento</button>
</div>

<div class="medicamentos-grid">
  <div class="medicamento-card position-relative" *ngFor="let medicamento of medicamentos; let i = index">
    <button
      class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
      (click)="removerMedicamento(i)"
      title="Remover medicamento"
      style="z-index:2"
    >×</button>
    <img src="https://cdn-icons-png.flaticon.com/512/5200/5200746.png" width="36" alt="Medicamento" />
    <div>
      <strong>Nome:</strong> {{ medicamento.name }}<br>
      <strong>Dosagem:</strong> {{ medicamento.dosage }}<br>
      <strong>Frequência:</strong> {{ medicamento.frequency }}
    </div>
  </div>
  <div *ngIf="medicamentos.length === 0" class="text-muted">
    Nenhum medicamento cadastrado para este paciente.
  </div>
</div>
