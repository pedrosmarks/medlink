<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>

<h2>Consultas de {{ pacienteNome }}</h2>

<div class="mb-3">
  <div class="row mb-2">
    <div class="col-md-4">
      <input type="date" class="form-control" [(ngModel)]="novaConsultaDate" placeholder="Data">
    </div>
    <div class="col-md-8">
      <input type="text" class="form-control" [(ngModel)]="novaConsultaReason" placeholder="Motivo da consulta">
    </div>
  </div>
  <div class="row mb-2">
    <div class="col-md-12">
      <textarea class="form-control" [(ngModel)]="novaConsultaNotes" placeholder="Observações (opcional)" rows="2"></textarea>
    </div>
  </div>
  <button class="btn btn-success" (click)="adicionarConsulta()">Adicionar Consulta</button>
</div>

<div class="consultas-grid">
  <div class="consulta-card position-relative" *ngFor="let consulta of consultas; let i = index">
      <button
        class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
        (click)="removerConsulta(i)"
        title="Remover consulta"
        style="z-index:2"
      >×</button>
      <img src="https://cdn-icons-png.flaticon.com/512/942/942748.png" width="36" alt="Consulta" />
      <div [ngClass]="{'soft-deleted': consulta.softDeleted}">
        <strong>Data:</strong> {{ consulta.date }}<br>
        <strong>Motivo:</strong> {{ consulta.reason }}<br>
        <strong>Observações:</strong> {{ consulta.notes || 'Nenhuma observação' }}
      </div>
  </div>
  <div *ngIf="consultas.length === 0" class="text-muted">
    Nenhuma consulta cadastrada para este paciente.
  </div>
</div>
