<div class="container mt-4">
  <button class="btn btn-success mb-3" (click)="abrirModalAdicionar()">Adicionar paciente</button>

  <!-- Modal simples -->
  <div class="modal-backdrop" *ngIf="modalAberto">
    <div class="modal-content">
      <h5>Adicionar paciente</h5>
      <input type="text" class="form-control mb-2" placeholder="Pesquisar por nome" [(ngModel)]="buscaNome" (input)="pesquisarPacientes()" />
      <ul class="list-group mb-2" *ngIf="resultadosBusca.length > 0">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let paciente of resultadosBusca">
          <span>{{ paciente.nome }}</span>
          <button class="btn btn-primary btn-sm" (click)="adicionarEspecialista(paciente)">Pedir acesso</button>
        </li>
      </ul>
      <button class="btn btn-secondary" (click)="fecharModalAdicionar()">Fechar</button>
    </div>
  </div>

  <div class="row">
    <div class="col-12 mb-4" *ngFor="let paciente of pacientes">
      <div class="card p-4">
        <div class="d-flex align-items-center">
          <img [src]="paciente.avatar" alt="Avatar" width="80" height="80" class="rounded-circle me-4 border">
          <div>
            <h4>{{ paciente.nome }}</h4>
            <p class="mb-1"><strong>CPF:</strong> {{ paciente.cpf }}</p>
            <p class="mb-1"><strong>Idade:</strong> {{ paciente.idade }} anos</p>
            <p class="mb-1"><strong>Tipo Sanguíneo:</strong> {{ paciente.tipoSanguineo }}</p>
            <p class="mb-1"><strong>Telefone:</strong> {{ paciente.telefone }}</p>
            <p class="mb-1"><strong>E-mail:</strong> {{ paciente.email }}</p>
            <p class="mb-1"><strong>Observações:</strong> {{ paciente.observacoes }}</p>
            <button
              class="btn btn-outline-primary mt-2"
              [routerLink]="['/medico/pacientes', paciente.id, 'prontuario']"
            >
              Acessar prontuário
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
