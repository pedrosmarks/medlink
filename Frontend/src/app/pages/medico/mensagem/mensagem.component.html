<!-- Improved medico chat layout -->
<div class="chat-root">
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <h3>Pacientes</h3>
    </div>

    <div class="sidebar-list">
      <div *ngIf="!pacientesComMensagens || pacientesComMensagens.length === 0" class="empty-state">Nenhum paciente encontrado</div>

      <button *ngFor="let item of pacientesComMensagens" class="sidebar-item" (click)="selecionarPaciente(item)" [class.active]="pacienteSelecionado?.paciente?.id === item.paciente.id">
        <div class="avatar-mini">{{ item.paciente.name.charAt(0) }}</div>
        <div class="info">
          <div class="title">{{ item.paciente.name }}</div>
          <div class="preview">{{ item.ultimaMensagem?.texto || 'Sem mensagens' }}</div>
        </div>
  <div class="meta"> <small>{{ item.ultimaMensagem?.data ? (item.ultimaMensagem?.data | date:'dd/MM') : '' }}</small></div>
        <div class="unread" *ngIf="contarMensagensNaoLidas(item) > 0">{{ contarMensagensNaoLidas(item) }}</div>
      </button>
    </div>
  </aside>

  <main class="chat-panel">
    <div *ngIf="!pacienteSelecionado" class="panel-empty">
      <div class="welcome">Selecione um paciente para começar</div>
    </div>

    <div *ngIf="pacienteSelecionado" class="panel-chat">
      <header class="panel-header">
        <div class="title">{{ pacienteSelecionado.paciente.name }}</div>
      </header>

      <div class="panel-messages" id="panelMessages">
        <div *ngFor="let m of pacienteSelecionado.mensagens" class="msg-row" [class.mine]="m.remetenteTipo === 'medico'">
          <div class="msg-bubble">
            <div class="msg-text">{{ m.texto }}</div>
            <div class="msg-meta"><small>{{ m.data | date:'dd/MM HH:mm' }}</small></div>
            <!-- botão 'Marcar lida' removido para visual mais limpo -->
          </div>
        </div>
      </div>

      <footer class="panel-composer">
        <textarea class="composer-input" [(ngModel)]="novaMensagem" placeholder="Digite sua mensagem..."></textarea>
        <button class="composer-send" (click)="enviarMensagem()" [disabled]="!novaMensagem.trim()">Enviar</button>
      </footer>
    </div>
  </main>
</div>
