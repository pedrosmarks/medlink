<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>

<h2>Minhas Cirurgias</h2>

<div *ngIf="carregando" class="loading">
  <p>Carregando cirurgias...</p>
</div>

<div class="cirurgias-grid">
  <div class="cirurgia-card" *ngFor="let cirurgia of cirurgias; let i = index">
    <img src="https://cdn-icons-png.flaticon.com/512/4246/4246625.png" width="36" alt="Cirurgia" />
    <div>
      <strong>Tipo:</strong> {{ cirurgia.tipo }}<br>
      <strong>Data:</strong> {{ cirurgia.data | date:'dd/MM/yyyy' }}
    </div>
  </div>
  <div *ngIf="!carregando && cirurgias.length === 0" class="text-muted">
    Nenhuma cirurgia cadastrada para você.
  </div>
</div>
