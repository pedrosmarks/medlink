<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>

<h2>Minhas Alergias</h2>

<div *ngIf="carregando" class="loading">
  <p>Carregando alergias...</p>
</div>

<div class="alergias-grid">
  <div class="alergia-card" *ngFor="let alergia of alergias; let i = index">
    <img src="https://cdn-icons-png.flaticon.com/512/5389/5389707.png" width="36" alt="Alergia" />
    <div>
      <strong>Alergia:</strong> {{ alergia.nome || alergia.descricao }}
    </div>
  </div>
  <div *ngIf="!carregando && alergias.length === 0" class="text-muted">
    Nenhuma alergia cadastrada para você.
  </div>
</div>
