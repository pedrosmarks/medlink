<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>

<h2>Meus Diagnósticos</h2>

<div *ngIf="carregando" class="loading">
  <p>Carregando diagnósticos...</p>
</div>

<div class="diagnosticos-grid">
  <div class="diagnostico-card" [ngClass]="{'soft-deleted': diagnostico.softDeleted}" *ngFor="let diagnostico of diagnosticos; let i = index">
    <img src="https://cdn-icons-png.flaticon.com/512/4320/4320498.png" width="36" alt="Diagnóstico" />
    <div>
      
    <strong>Diagnóstico:</strong> {{ diagnostico.description }}<br>
      <strong>Data:</strong> {{ diagnostico.date | date:'dd/MM/yyyy' }}
    </div>
  </div>
  <div *ngIf="!carregando && diagnosticos.length === 0" class="text-muted">
    Nenhum diagnóstico cadastrado para você.
  </div>
</div>
