<button class="btn btn-secondary mb-3" [routerLink]="['../']">
  ← Voltar ao prontuário
</button>

<h2>Meus Medicamentos</h2>

<div *ngIf="carregando" class="loading">
  <p>Carregando medicamentos...</p>
</div>

<div class="medicamentos-grid">
  <div class="medicamento-card" *ngFor="let medicamento of medicamentos; let i = index">
    <img src="https://cdn-icons-png.flaticon.com/512/5200/5200746.png" width="36" alt="Medicamento" />
    <div>
      <strong>Nome:</strong> {{ medicamento.nome }}<br>
      <strong>Dosagem:</strong> {{ medicamento.dosagem }}
    </div>
  </div>
  <div *ngIf="!carregando && medicamentos.length === 0" class="text-muted">
    Nenhum medicamento cadastrado para você.
  </div>
</div>
