<div class="paciente-layout">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <h3>MedLink</h3>
        <span class="subtitle">
          <fa-icon [icon]="faUserInjured" class="area-icon"></fa-icon>
          Área do Paciente
        </span>
      </div>
    </div>
    
    <div class="sidebar-menu">
      <ul class="nav-list">
        <li class="nav-item">
          <a [routerLink]="['/paciente/dashboard']" class="nav-link" routerLinkActive="active">
            <fa-icon [icon]="faDesktop" class="nav-icon"></fa-icon>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/paciente/perfil']" class="nav-link" routerLinkActive="active">
            <fa-icon [icon]="faCircleUser" class="nav-icon"></fa-icon>
            <span class="nav-text">Perfil</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/paciente/medico']" class="nav-link" routerLinkActive="active">
            <fa-icon [icon]="faHospitalUser" class="nav-icon"></fa-icon>
            <span class="nav-text">Médicos</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/paciente/prontuario']" class="nav-link" routerLinkActive="active">
            <fa-icon [icon]="faFileInvoice" class="nav-icon"></fa-icon>
            <span class="nav-text">Prontuário</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/paciente/mensagem']" class="nav-link" routerLinkActive="active">
            <fa-icon [icon]="faMessage" class="nav-icon"></fa-icon>
            <span class="nav-text">Mensagens</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a [routerLink]="['/paciente/requisicoes']" class="nav-link" routerLinkActive="active">
            <div class="notification-wrapper">
              <fa-icon [icon]="faClipboardCheck" class="nav-icon"></fa-icon>
              <span *ngIf="notificationCount > 0" class="notification-badge">{{ notificationCount }}</span>
            </div>
            <span class="nav-text">Requisições</span>
          </a>
        </li>
      </ul>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
             alt="Paciente" class="user-avatar">
        <div class="user-details">
          <span class="user-name">{{ userName }}</span>
          <span class="user-email">{{ userEmail }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="onLogout()" title="Sair">
        <fa-icon [icon]="faSignOutAlt"></fa-icon>
      </button>
    </div>
  </nav>
  
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
