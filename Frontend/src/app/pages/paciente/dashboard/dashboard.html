<div class="dashboard-container">
  <!-- Cabeçalho de Boas-vindas -->
  <div class="welcome-header">
    <div class="welcome-content">
      <h1 class="welcome-title">Olá, {{ pacienteNome }}! 👋</h1>
      <p class="welcome-subtitle">Bem-vindo ao seu painel pessoal. Aqui você pode acompanhar suas consultas, vacinas e informações médicas.</p>
    </div>
    <div class="welcome-stats">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-calendar-check"></i>
        </div>
        <div class="stat-info">
          <h3>{{ proximasConsultas }}</h3>
          <p>Próximas Consultas</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-syringe"></i>
        </div>
        <div class="stat-info">
          <h3>{{ vacinasAtualizadas }}</h3>
          <p>Vacinas em Dia</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Cards do Dashboard -->
  <div class="dashboard-grid">
    <div *ngFor="let card of cards" class="dashboard-card">
      <div class="card-content">
        <div class="card-header">
          <h3 class="card-title">{{ card.title }}</h3>
          <div class="card-icon">
            <i [class]="card.icon"></i>
          </div>
        </div>
        <p class="card-description">{{ card.text }}</p>
        <div class="card-footer">
          <span class="card-value">{{ card.value || '---' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
